name: Chat test CI
on:
  pull_request:
    branches: [develop, main, test/ai-chat-ui]
permissions:
  contents: read
concurrency:
  group: chat-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:chat
